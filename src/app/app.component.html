<ion-app>
  <!-- Main Menu -->
  <ion-menu contentId="main-content" menuId="main-menu" side="end">
    <ion-header>
      <ion-toolbar class="menu-toolbar" style="--background: #08b8da">
        <ion-buttons slot="start">
          <ion-button (click)="closeMenu()" fill="clear">
            <ion-icon slot="icon-only" name="close" color="light"></ion-icon>
          </ion-button>
        </ion-buttons>
        <img src="assets/icon/logo.png" alt="Logo" class="menu-logo" (click)="closeMenu()" />
      </ion-toolbar>
    </ion-header>

    <ion-content class="menu-content">
      <ion-list lines="none" class="menu-list">
        <!-- Use routerLink with exact path -->
        <ion-item button detail="false" routerLink="/search" routerDirection="root" (click)="closeMenu()">
          <ion-label>Search Offers / Deals</ion-label>
        </ion-item>

        <ion-item button detail="false" routerLink="/coupons/local" routerDirection="root" (click)="closeMenu()">
          <ion-label>Browse Local Offers / Grocery Flyers / Freebies etc</ion-label>
        </ion-item>

        <ion-item button detail="false" routerLink="/coupons/national" routerDirection="root" (click)="closeMenu()">
          <ion-label>Browse National / Online offers</ion-label>
        </ion-item>

        <ion-item button detail="false" routerLink="/privacy" routerDirection="root" (click)="closeMenu()">
          <ion-label>Privacy Policy</ion-label>
        </ion-item>

        <ion-item button detail="false" (click)="openExternalLink('https://www.dynamiccoupons.com/donation_index.php')">
          <ion-label>Let's Fundraise Together</ion-label>
        </ion-item>

        <ion-item button detail="false" (click)="openExternalLink('https://www.dynamiccoupons.com/faq.php')">
          <ion-label>FAQ</ion-label>
        </ion-item>

        <div class="menu-notice">
          <p>
            Report any inappropriate or age-inappropriate ads or any questions or concerns via our form below.
          </p>
        </div>

        <ion-item button detail="false" routerLink="/contact" routerDirection="root" (click)="closeMenu()">
          <ion-label>Contact us</ion-label>
        </ion-item>
      </ion-list>

      <div class="menu-footer">
        <img src="assets/images/copy.png" alt="Copyright" class="copyright-img" />
        <div class="copyright-year">2024</div>
        <div class="website-link">
          <a (click)="openExternalLink('https://www.dynamiccoupons.com')">dynamiccoupons.com</a>
        </div>
      </div>
    </ion-content>
  </ion-menu>

  <!-- Main Content Area -->
  <div class="ion-page" id="main-content">
    <ion-router-outlet></ion-router-outlet>
  </div>
</ion-app>
